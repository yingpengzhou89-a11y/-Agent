[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "interview-copilot-backend"
version = "0.1.0"
description = "Backend for Interview Copilot Agent"
requires-python = ">=3.13,<3.14"

dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "asyncpg>=0.30,<1.0",
  "alembic>=1.14,<2.0",
  "pgvector>=0.3,<1.0",
  "python-multipart>=0.0.12,<1.0",
  "pymupdf>=1.24,<2.0",
  "python-docx>=1.1,<2.0",
  "PyJWT>=2.10,<3.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "email-validator>=2.2,<3.0",
  "slowapi>=0.1.9,<1.0",
]


[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "aiosqlite>=0.20,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.7,<1.0",
]


[tool.hatch.build.targets.wheel]
packages = ["app"]


[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.ruff]
line-length = 100
target-version = "py311"
